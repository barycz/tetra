<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- tetra Terminal: a prompt chevron made of two of the mark's triangles
       (lighter above, darker below) and a cursor. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343944"/>
      <stop offset="1" stop-color="#282c35"/>
    </linearGradient>
  </defs>
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="url(#tile)" stroke="#4a505e"/>
  <polygon points="15,17 33,30 15,30" fill="#70a4ff"/>
  <polygon points="15,30 33,30 15,43" fill="#3665b8"/>
  <rect x="36" y="39" width="14" height="4" rx="1" fill="#d8dde6"/>
</svg>
